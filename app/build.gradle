plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.haobv.solvetowatch'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.haobv.solvetowatch'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Plain JVM tests for the question generator and config.xml (./gradlew test), never in the APK.
    testImplementation 'junit:junit:4.13.2'
}
